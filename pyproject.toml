[project]
name = "hanyan-cognitive-core"
version = "0.1.0"
description = "Memory Operating System for AI Agents"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "pgvector>=0.3.0",
    "alembic>=1.13.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-dotenv>=1.0.0",
    "uuid6>=2024.7.10",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    "aiosqlite>=0.20.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Only ship the gateway package. The local ``mcp/`` directory is intentionally
# NOT declared as a package: it would collide with the third-party ``mcp`` PyPI
# distribution in site-packages. It is imported at runtime via the project root.
packages = ["gateway", "gateway.core", "gateway.api", "gateway.models", "gateway.schemas", "gateway.services", "scanner"]
