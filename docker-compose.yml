services:
  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      - HCC_DATABASE_URL=postgresql+asyncpg://hcc:hcc@db:5432/hcc
      - HCC_REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./gateway:/app/gateway
    command: uvicorn gateway.main:app --host 0.0.0.0 --port 8000 --reload

  mcp:
    build: .
    ports:
      - "8001:8001"
    environment:
      - HCC_DATABASE_URL=postgresql+asyncpg://hcc:hcc@db:5432/hcc
      - HCC_REDIS_URL=redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./mcp:/app/mcp
      - ./core:/app/core
      - ./gateway:/app/gateway
    command: python mcp/server.py --transport streamable-http --host 0.0.0.0 --port 8001

  redis:
    image: redis:7-alpine
    ports:
      - "6381:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: hcc
      POSTGRES_PASSWORD: hcc
      POSTGRES_DB: hcc
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hcc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
